name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev-paul]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.30.2'
  # Bumped from default 2GB so tsc + vitest don't OOM as the codebase grows.
  NODE_OPTIONS: '--max-old-space-size=4096'
  # Skip Puppeteer browser download during CI build (only needed at runtime).
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  validate:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ops/shared build

      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm --filter @ops/web build

      - name: Build functions
        run: pnpm --filter @ops/functions build

      - name: Typecheck pdf-renderer
        run: pnpm --filter @ops/pdf-renderer typecheck

      - name: Build pdf-renderer
        run: pnpm --filter @ops/pdf-renderer build

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ops/shared build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Write coverage summary
        if: always()
        run: |
          missing=0
          {
            echo "## Coverage Summary"
            echo
            for pkg in "packages/shared" "apps/functions" "apps/web"; do
              summary="$pkg/coverage/coverage-summary.json"
              if [ -f "$summary" ]; then
                echo "### $pkg"
                echo '```'
                node -e "
                  try {
                    const s = require('./$summary').total;
                    for (const [k, v] of Object.entries(s)) {
                      console.log(k.padEnd(12), v.pct + '%', '(' + v.covered + '/' + v.total + ')');
                    }
                  } catch (err) {
                    console.log('⚠️ could not parse coverage summary for $pkg (' + err.message + ')');
                  }
                "
                echo '```'
              else
                echo "### $pkg"
                echo "⚠️ missing coverage-summary.json for $pkg"
                missing=1
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" -eq 1 ]; then
            echo "::error::Missing coverage-summary.json for one or more expected packages (packages/shared, apps/functions, apps/web) — coverage was not collected."
            exit 1
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/shared/coverage
            apps/functions/coverage
            apps/web/coverage
          retention-days: 14
          if-no-files-found: warn

  rules-tests:
    name: Firestore Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # firebase-tools' Firestore emulator requires Java 21+. Ubuntu runners
      # default to an older Java on PATH, so pin it explicitly.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ops/shared build

      - name: Run rules tests
        run: pnpm test:rules

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # Hard cap so a hung emulator/browser can never block CI for hours. A
    # healthy run finishes in ~5-8 min; 25 leaves ample headroom.
    timeout-minutes: 25
    # Uses a `demo-` project id so the emulators run fully offline (no
    # credentials or live Firebase project needed), mirroring how the specs
    # run against `pnpm dev:emulators` locally.
    env:
      FIREBASE_PROJECT_ID: demo-ops
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # firebase-tools' Firestore + Storage emulators are Java processes and
      # require Java 21+ (see the rules-tests job above for the same pin).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ops/shared build

      # The Functions emulator serves the compiled output in apps/functions/lib
      # (firebase.json points there) — syncMyClaims must be callable so the app
      # can resolve custom claims after dev sign-in.
      - name: Build functions
        run: pnpm --filter @ops/functions build

      # The Functions emulator resolves every declared param at startup. Any
      # non-secret defineString() param that has no value and no default is
      # resolved by prompting on stdin — and because firebase-tools calls
      # resolveBackend() with nonInteractive:false, a credential-less CI runner
      # with no TTY blocks forever on that prompt, hanging the whole job before
      # any test runs. Provide every string param in the emulator dotenv file
      # (firebase-tools reads <functionsSource>/.env.local; firebase.json source
      # = apps/functions/lib) so none of them prompt. Empty values are treated
      # as "provided" (the resolver only checks key presence), and the functions
      # that read them are either never triggered by the specs or skip on an
      # empty value (e.g. onObservationWritten skips sheet sync when
      # MASTER_LOG_SHEET_ID is unset).
      #
      # Secrets (defineSecret) are NOT prompted in emulator mode; they are read
      # at invocation time from .secret.local. Provide dummy values there too so
      # the emulator never falls back to Google Cloud Secret Manager (an ADC
      # call that also hangs on metadata-server detection in CI).
      #
      # Written after the build since tsup recreates the output dir.
      - name: Provide offline Functions params/secrets for the emulator
        run: |
          cat > apps/functions/lib/.env.local <<'EOF'
          DRIVE_PARENT_FOLDER_ID=
          GOOGLE_OAUTH_CLIENT_ID=
          MASTER_LOG_SHEET_ID=
          PDF_RENDERER_URL=
          EOF
          cat > apps/functions/lib/.secret.local <<'EOF'
          GEMINI_API_KEY=demo-gemini-key
          GOOGLE_OAUTH_CLIENT_SECRET=demo-oauth-secret
          EOF

      # Both Playwright projects (desktop-chrome and the iPad-viewport
      # tablet-ipad) run on Chromium — see the comment in playwright.config.ts
      # for why the tablet profile does not use WebKit.
      - name: Install Playwright browsers
        run: pnpm --filter @ops/web exec playwright install --with-deps chromium

      # Vite only wires the SDKs to the emulator suite when VITE_USE_EMULATORS
      # is set; the demo project id keeps everything offline. The dev-sign-in
      # page fetches custom tokens from the local dev-auth-server.
      - name: Write web env for the emulator run
        run: |
          cat > apps/web/.env.local <<'EOF'
          VITE_FIREBASE_API_KEY=demo-key
          VITE_FIREBASE_AUTH_DOMAIN=demo-ops.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=demo-ops
          VITE_FIREBASE_STORAGE_BUCKET=demo-ops.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000
          VITE_FIREBASE_APP_ID=1:000000000000:web:0000000000000000000000
          VITE_USE_EMULATORS=true
          VITE_DEV_AUTH_SERVER=http://127.0.0.1:8787
          EOF

      # emulators:exec boots Firestore/Auth/Functions/Storage, exports the
      # *_EMULATOR_HOST vars into the child command, then tears everything down
      # when it exits. Inside: start the dev-auth-server (mints custom tokens
      # against the Auth emulator — no real credentials needed), wait for it to
      # report healthy (a broken/slow server here must fail the job, not let
      # every auth-dependent spec silently fall back to test.skip()), seed the
      # synthetic dataset the specs expect, then run Playwright (which starts
      # the Vite dev server via its own webServer config).
      - name: Run E2E against the emulator suite
        run: >
          pnpm exec firebase emulators:exec
          --project demo-ops
          --only firestore,auth,functions,storage
          "node scripts/dev-auth-server.mjs & node scripts/wait-for-dev-auth-server.mjs && pnpm seed:dev && pnpm test:e2e"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
