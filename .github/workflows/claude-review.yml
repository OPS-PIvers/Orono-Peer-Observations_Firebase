name: Claude PR review

# Reviews every non-draft PR with Claude Sonnet 5.5 and posts findings as
# PR comments. Auth: CLAUDE_CODE_OAUTH_TOKEN (Max subscription, created with
# `claude setup-token`), same setup as SpartBoard's claude-review.yml.
# Review-only: it cannot push, merge, or deploy.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review (Sonnet 5.5)
    # Dependabot and fork PRs can't read repo secrets, so the action would fail.
    if: >-
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claude review
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the
            current directory; see README.md for project layout.

            Focus on, in order:
            - Correctness bugs and regressions
            - Security, especially Firestore/Storage rules and access control
            - Anything that could break the production deploy (merging to
              main auto-deploys hosting, functions and the pdf-renderer)
            - Missing or inadequate tests for changed behavior

            Skip style nits that lint/prettier already enforce. Only report
            issues you are confident are real. If there are none, say so in
            one short comment.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues tied to specific lines, and
            `gh pr comment` for one top-level summary. Only post GitHub
            comments; don't submit review text as messages.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The action hides Claude's output, so report the outcome (and any auth
      # or API error) here without exposing the whole conversation.
      - name: Report review result
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
        run: |
          FILE="${EXECUTION_FILE:-${RUNNER_TEMP}/claude-execution-output.json}"
          if [ ! -f "$FILE" ]; then
            echo "::warning title=Claude review did not run::No execution log. This workflow file differs from main's copy, or the job was skipped."
            exit 0
          fi
          jq -s 'flatten(1) | map(select(.type == "result")) | last
                 | {is_error, num_turns, api_error_status, result: ((.result // "") | tostring | .[0:200])}' "$FILE"
